name = "my-insforge"
main = "worker/index.js"
compatibility_date = "2026-05-07"
workers_dev = true
routes = [
  { pattern = "insforge.space/*", zone_name = "insforge.space" },
  { pattern = "www.insforge.space/*", zone_name = "insforge.space" }
]

[vars]
CREEM_API_BASE = "https://api.creem.io"
CREEM_ENV = "live"

[assets]
directory = "./dist"
binding = "SITE_ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/github",
  "/ai",
  "/vs-supabase",
  "/yc",
  "/founder",
  "/dev",
  "/docs",
  "/pricing",
  "/privacy",
  "/terms",
  "/sitemap.xml",
  "/robots.txt",
  "/api/*"
]
